# Hadoop/Spark Kerberos JAAS config
# 强制使用 FILE ticket cache（KRB5CCNAME 或 java.security.krb5.ccache 指定的路径）
com.sun.security.jgss.krb5.initiate {
    com.sun.security.auth.module.Krb5LoginModule required
    useTicketCache=true
    useKeyTab=false
    doNotPrompt=true;
};

com.sun.security.jgss.krb5.accept {
    com.sun.security.auth.module.Krb5LoginModule required
    useTicketCache=true
    doNotPrompt=true;
};
